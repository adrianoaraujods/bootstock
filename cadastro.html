<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BootStock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ETAPA 1 -->
    <header class="navbar navbar-expand sticky-top bg-body-secondary">
      <nav class="container">
        <a class="navbar-brand" href="./index.html">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="36"
            viewBox="0 0 62 40"
            fill="none"
            id="Logo"
          >
            <path
              d="M7.02047 20.514L38.3369 12.1305H10.0945L7.02047 20.514ZM6.59954 21.662L5.2839 25.25H5.28572L2.09656 34.1495L38.5941 13.0969L6.59954 21.662ZM1.57495 35.605L0 40H13.0334L39.094 13.9633L1.57495 35.605ZM14.4489 40H25.1661L39.8062 14.666L14.4489 40ZM26.3219 40H34.0116L40.6711 15.1693L26.3219 40ZM35.0478 40H41.6376V15.4292L35.0478 40ZM42.6385 40H49.2288L42.6385 15.4273V40ZM50.1713 39.6503L52.3203 33.6534C52.6446 32.7483 52.7601 31.7948 52.673 30.8601L43.6055 15.1691L50.1713 39.6503ZM50.386 24.9025C51.4645 24.6247 52.4867 24.1867 53.421 23.6103L44.4732 14.6707L50.386 24.9025ZM54.262 23.0363C55.1738 22.3502 55.9801 21.5219 56.6455 20.5763L45.1804 13.9629L54.262 23.0363ZM57.1836 19.732C57.492 19.1957 57.7578 18.6284 57.9758 18.0338L58.5256 16.5346L45.6778 13.0952L57.1836 19.732ZM58.8713 15.5918L60.1404 12.1305H45.9415L58.8713 15.5918ZM60.5071 11.1305L61.6315 8.06389C61.78 7.65908 61.8821 7.25179 61.9412 6.84684L45.9397 11.1305H60.5071ZM62 5.79582C61.9487 4.25961 61.2986 2.82175 60.2459 1.76246L45.6788 10.1651L62 5.79582ZM59.4324 1.07701C58.4714 0.403271 57.2938 0 55.9925 0H54.4856L45.1777 9.29939L59.4324 1.07701ZM53.0701 0H49.4371L44.4744 8.58786L53.0701 0ZM48.2814 0H45.7756L43.6056 8.09119L48.2814 0ZM44.7394 0H42.6385V7.83342L44.7394 0ZM41.6376 0H39.5372L41.6376 7.83154V0ZM38.501 0H35.9953L40.6709 8.09095L38.501 0ZM34.8396 0H31.2046L39.8051 8.59257L34.8396 0ZM29.7891 0H22.9754L39.0967 9.29905L29.7891 0ZM10.4612 11.1305H38.3387L12.953 4.33465L10.4612 11.1305ZM13.3033 3.39316L38.5932 10.1633L20.9736 0H18.3885C16.1557 0 14.1524 1.3462 13.3033 3.39316Z"
              fill="#0e6af4"
            />
          </svg>

          BootStock
        </a>
      </nav>
    </header>

    <main>
      <section class="container">
        <div class="text-center my-5">
          <h1 class="fw-bold display-6">Bem-vindo ao BootStock!</h1>
          <p class="text-body-secondary">
            Crie sua conta preenchendo os campos abaixo.
          </p>
        </div>

        <article class="card">
          <header
            class="card-header d-flex align-items-center gap-2 bg-gradient fw-semibold"
          >
            <i class="bi fs-4 bi-person-plus"></i>
            <h2 class="mb-0 fs-4">Cadastro de conta</h2>
          </header>

          <div class="card-body">
            <form class="row g-3">
              <div class="col-md-6">
                <label for="cad-nome" class="form-label">Nome completo</label>
                <input
                  type="text"
                  class="form-control"
                  id="cad-nome"
                  placeholder="João da Silva"
                />
              </div>

              <div class="col-md-6">
                <label for="cad-email" class="form-label">E-mail</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="bi bi-envelope"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control is-valid"
                    id="cad-email"
                    placeholder="joao@email.com"
                  />
                </div>
                <div class="valid-feedback d-block">E-mail válido!</div>
              </div>

              <div class="col-md-6">
                <label for="cad-senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="cad-senha" />
                <div class="form-text">
                  Use no mínimo 8 caracteres, com letras e números.
                </div>
              </div>

              <div class="col-md-6">
                <label for="doc" class="form-label">Documento</label>
                <div class="input-group">
                  <select
                    class="form-select flex-grow-0 w-auto"
                    aria-label="DDD"
                    placeholder="000.000.000-00"
                  >
                    <option value="CPF" selected>CPF</option>
                    <option value="CNPJ">CNPJ</option>
                  </select>
                  <input
                    id="doc"
                    type="tel"
                    class="form-control is-invalid"
                    placeholder="000.000.000-00"
                  />
                  <div class="invalid-feedback">
                    CPF inválido. Verifique os números digitados.
                  </div>
                </div>
              </div>

              <div class="col-md-6">
                <label for="cad-nasc" class="form-label"
                  >Data de nascimento</label
                >
                <input type="date" class="form-control" id="cad-nasc" />
              </div>

              <div class="col-md-6">
                <span class="form-label d-block">Sexo</span>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sexo"
                    id="sexo-masculino"
                    checked
                  />
                  <label class="form-check-label" for="sexo-masculino">
                    Masculino
                  </label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="sexo"
                    id="sexo-feminino"
                  />
                  <label class="form-check-label" for="sexo-feminino">
                    Feminino
                  </label>
                </div>
              </div>

              <div class="col-md-6">
                <label for="cad-cep" class="form-label">CEP</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="bi bi-geo-alt"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    id="cad-cep"
                    placeholder="00000-000"
                    inputmode="numeric"
                  />
                </div>
                <div class="form-text">
                  Calculamos o frete automaticamente pelo CEP.
                </div>
              </div>

              <div class="col-md-6">
                <label for="cad-tel" class="form-label">Telefone</label>
                <div class="input-group">
                  <select
                    class="form-select flex-grow-0 w-auto"
                    aria-label="DDD"
                  >
                    <option value="11">(11)</option>
                    <option value="31" selected>(31)</option>
                    <option value="38">(38)</option>
                  </select>
                  <input
                    type="tel"
                    class="form-control"
                    id="cad-tel"
                    placeholder="99999-9999"
                  />
                </div>
              </div>

              <div class="col-md-6">
                <label for="cad-uf" class="form-label">Estado</label>
                <select class="form-select" id="cad-uf">
                  <option selected>Selecione…</option>

                  <optgroup label="Norte">
                    <option value="AC">Acre</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>
                  </optgroup>

                  <optgroup label="Nordeste">
                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>
                  </optgroup>

                  <optgroup label="Centro-Oeste">
                    <option value="DF">Distrito Federal</option>
                    <option value="GO">Goiás</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                  </optgroup>

                  <optgroup label="Sudeste">
                    <option value="ES">Espírito Santo</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                  </optgroup>

                  <optgroup label="Sul">
                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                  </optgroup>
                </select>
              </div>

              <div class="col-md-6">
                <label for="cad-cidade" class="form-label">Cidade</label>
                <input
                  type="text"
                  class="form-control"
                  id="cad-cidade"
                  placeholder="Belo Horizonte"
                />
              </div>

              <div class="col-md-6">
                <span class="form-label d-block">Preferências</span>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cad-news"
                    checked
                  />
                  <label class="form-check-label" for="cad-news"
                    >Quero receber promoções por e-mail</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cad-termos"
                  />
                  <label class="form-check-label" for="cad-termos"
                    >Aceito os termos de uso</label
                  >
                </div>
              </div>
            </form>
          </div>

          <footer class="card-footer">
            <button type="submit" class="btn btn-primary btn-lg w-100">
              Criar conta
            </button>
          </footer>
        </article>
      </section>
    </main>
  </body>
</html>
